name: Build Hostinger production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate annual restaurant budget workbook
        run: |
          python3 -m pip install openpyxl==3.1.5
          python3 scripts/generate-restaurant-12-month-workbook.py
          python3 - <<'PY'
          from openpyxl import load_workbook
          p='public/downloads/restaurant-12-month-budget-template.xlsx'
          w=load_workbook(p)
          assert {'Instructions','12-Month Budget','Dashboard'} <= set(w.sheetnames)
          assert w['12-Month Budget']['B19'].value.startswith('=')
          assert w['12-Month Budget']['B38'].value.startswith('=')
          print('Workbook generated and checked')
          PY

      - name: Run automated regression tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Verify business ratio calculator in generated production HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/calculators/equivalent-ratio-calculator/index.html')
          assert p.exists(), f'Missing generated page: {p}'
          html=p.read_text(encoding='utf-8')
          required=('Business Equivalent Ratio Calculator', 'business ratio', 'financial')
          assert required[0] in html, 'Old equivalent-ratio title detected: regenerate from updated main'
          assert any(token in html.lower() for token in ('cost-to-revenue', 'business', 'ratio')), 'Missing business intent'
          print('PASS: business equivalent ratio metadata included in production HTML')
          PY

      - name: Verify Future Value Phase 1 and Phase 2 production HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/calculators/future-value-calculator/index.html')
          assert p.exists(), f'Missing production route: {p}'
          html=p.read_text(encoding='utf-8')
          required=(
              'Plan toward a future savings goal',
              'Advanced investment growth plan',
              'Delay contribution payments',
              'Compare investment plans side by side',
              'Goal milestones and funding timeline',
              'One-time deposits and withdrawals',
          )
          missing=[name for name in required if name not in html]
          assert not missing, f'Missing Future Value modules: {missing}'
          print('PASS: Future Value production HTML includes Phase 1 and Phase 2')
          PY

      - name: Audit rendered routes and internal links
        run: python3 scripts/audit-built-site.py --output /tmp/site-inventory.json

      - name: Publish ready-to-serve files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-deploy
          publish_dir: ./dist
          force_orphan: true

      - name: Publish new and changed content to social accounts
        id: social_publish
        continue-on-error: true
        if: ${{ !contains(github.event.head_commit.message, '[skip social]') }}
        env:
          MAKE_SOCIAL_WEBHOOK_URL: ${{ secrets.MAKE_SOCIAL_WEBHOOK_URL }}
          SOCIAL_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          SOCIAL_FIRST_TEST_URL: https://mybreakeven.com/blogs/agency-billable-utilization-rate/
        run: node scripts/publish-social.mjs

      - name: Report optional social publishing failure
        if: ${{ steps.social_publish.outcome == 'failure' }}
        run: |
          echo '::warning::Production website build and publishing succeeded; optional social posting failed. Review the social publisher logs separately.'
          echo '### Optional social publication failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Website publishing completed. Review social publishing logs and webhook integration independently.' >> "$GITHUB_STEP_SUMMARY"
