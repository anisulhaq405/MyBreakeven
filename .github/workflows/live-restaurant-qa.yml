name: Live restaurant workbook and mobile QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/live-restaurant-browser-qa.mjs'
      - '.github/workflows/live-restaurant-qa.yml'
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose runner and npm availability
        run: |
          node --version
          npm --version
          npm config get registry
          df -h .
      - name: Install isolated Playwright package
        run: |
          mkdir -p /tmp/mybreakeven-liveqa
          npm install --prefix /tmp/mybreakeven-liveqa --no-package-lock --no-save --ignore-scripts playwright@1.57.0
          mkdir -p node_modules
          ln -s /tmp/mybreakeven-liveqa/node_modules/playwright node_modules/playwright
          ln -s /tmp/mybreakeven-liveqa/node_modules/playwright-core node_modules/playwright-core
          node -e "import('playwright').then(x=>console.log('Playwright imported:',typeof x.chromium.launch)).catch(e=>{console.error(e);process.exit(1)})"
      - name: Install Chromium
        run: /tmp/mybreakeven-liveqa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify real workbook HTTP download and mobile browser rendering
        run: node scripts/live-restaurant-browser-qa.mjs
      - name: Capture preflight and browser setup diagnostics
        if: always()
        run: |
          echo "Node: $(node --version)" > live-qa-preflight.txt
          echo "npm: $(npm --version)" >> live-qa-preflight.txt
          echo "Playwright package present: $(test -e /tmp/mybreakeven-liveqa/node_modules/playwright/package.json && echo yes || echo no)" >> live-qa-preflight.txt
          echo "Playwright executable present: $(test -e /tmp/mybreakeven-liveqa/node_modules/.bin/playwright && echo yes || echo no)" >> live-qa-preflight.txt
      - name: Publish QA results in workflow summary
        if: always()
        run: |
          echo "## Six-page live SEO/mobile QA" >> "$GITHUB_STEP_SUMMARY"
          if [ -f live-qa-report.json ]; then
            node -e 'const r=require("./live-qa-report.json"); const passed=r.checks.filter(x=>x.pass).length; const failed=r.checks.filter(x=>!x.pass); console.log("Checks passed: "+passed+"/"+r.checks.length); console.log("Failed checks: "+failed.length); for(const x of failed)console.log("- "+x.name+": "+x.detail);' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Report missing: browser/install step stopped before tests executed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Screenshots and machine-readable details are in restaurant-live-qa artifact." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and mobile screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-live-qa
          path: |
            live-qa-preflight.txt
            live-qa-report.json
            qa-*.png
          if-no-files-found: warn
