name: Day 2 actual browser acceptance

on:
  pull_request:
    paths:
      - 'scripts/audit-day2-browser.mjs'
      - '.github/workflows/day2-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install existing project dependencies
        run: npm ci
      - name: Build current project
        run: npm run build
      - name: Install temporary browser QA dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve built site locally
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/day2-preview.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/calculators/fire-calculator/; then exit 0; fi
            sleep 1
          done
          cat /tmp/day2-preview.log
          exit 1
      - name: Run Chromium mobile, CSV and print acceptance
        run: node scripts/audit-day2-browser.mjs
      - name: Upload mobile screenshots, exports and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day2-browser-qa
          path: /tmp/mybreakeven-day2-browser/
          retention-days: 7
          if-no-files-found: warn
