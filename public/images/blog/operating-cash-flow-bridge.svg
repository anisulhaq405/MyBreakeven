<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="title desc"><title id="title">From accounting profit to operating cash</title><desc id="desc">Signed bridge: net income + noncash − operating asset increases + liability increases</desc><rect width="1000" height="500" rx="20" fill="#f1f8f5"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="29" fill="#163c38" >From accounting profit to operating cash</text><text x="40" y="89" font-size="18" fill="#4d6661" >Signed bridge: net income + noncash − operating asset increases + liability increases</text><rect x="35" y="145" width="172" height="180" rx="13" fill="#ffffff" stroke="#b8d4ca"/><text x="50" y="180" font-size="18" fill="#163c38" >Net income</text><text x="50" y="235" font-size="29" fill="#163c38" >$9,000</text><text x="50" y="280" font-size="14" fill="#4d6661" >Accrual result</text><rect x="225" y="145" width="172" height="180" rx="13" fill="#ffffff" stroke="#b8d4ca"/><text x="240" y="180" font-size="18" fill="#163c38" >Depreciation</text><text x="240" y="235" font-size="29" fill="#163c38" >+$3,000</text><text x="240" y="280" font-size="14" fill="#4d6661" >Noncash add-back</text><rect x="415" y="145" width="172" height="180" rx="13" fill="#ffffff" stroke="#b8d4ca"/><text x="430" y="180" font-size="18" fill="#163c38" >Operating assets</text><text x="430" y="235" font-size="29" fill="#163c38" >−$18,000</text><text x="430" y="280" font-size="14" fill="#4d6661" >AR + stock + prepaid</text><rect x="605" y="145" width="172" height="180" rx="13" fill="#ffffff" stroke="#b8d4ca"/><text x="620" y="180" font-size="18" fill="#163c38" >Operating debts</text><text x="620" y="235" font-size="29" fill="#163c38" >+$8,000</text><text x="620" y="280" font-size="14" fill="#4d6661" >AP + payroll accrual</text><rect x="795" y="145" width="172" height="180" rx="13" fill="#d6efe3" stroke="#b8d4ca"/><text x="810" y="180" font-size="18" fill="#163c38" >Operating cash</text><text x="810" y="235" font-size="29" fill="#163c38" >$2,000</text><text x="810" y="280" font-size="14" fill="#4d6661" >Matches direct view</text><text x="40" y="390" font-size="22" fill="#163c38" >The add-back reverses a noncash expense; it is not a cash receipt.</text><text x="40" y="470" font-size="16" fill="#4d6661" >MyBreakeven • Original fictional USD example • March 2026</text></g></svg>