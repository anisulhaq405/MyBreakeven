<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Salon owner contribution by chair model</title>
  <desc id="desc">Rental contribution is $1,100 per occupied chair. Commission contribution rises from $850 at $3,000 service sales to $1,750 at $5,000. The lines cross at $3,555.56 in service sales.</desc>
  <rect width="960" height="480" fill="#f6f9fb" rx="16"/>
  <text x="56" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#163247">Where commission catches chair rent</text>
  <text x="56" y="86" font-family="Arial,sans-serif" font-size="17" fill="#455c6a">Illustrative monthly contribution to shared salon overhead</text>
  <g stroke="#d8e2e8" stroke-width="2"><path d="M135 135H860M135 195H860M135 255H860M135 315H860M135 375H860"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#455c6a" text-anchor="end"><text x="122" y="380">$500</text><text x="122" y="320">$800</text><text x="122" y="260">$1,100</text><text x="122" y="200">$1,400</text><text x="122" y="140">$1,700</text></g>
  <path d="M155 255H845" stroke="#136e79" stroke-width="6"/>
  <path d="M155 305L845 125" stroke="#de8138" stroke-width="6"/>
  <circle cx="155" cy="305" r="7" fill="#de8138"/>
  <circle cx="347" cy="255" r="9" fill="#243b58" stroke="#fff" stroke-width="3"/>
  <circle cx="845" cy="125" r="7" fill="#de8138"/>
  <g font-family="Arial,sans-serif" fill="#263b49"><text x="155" y="412" font-size="16">$3,000 service sales</text><text x="320" y="412" font-size="16">$3,556</text><text x="748" y="412" font-size="16">$5,000</text></g>
  <text x="360" y="229" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#263b49">Crossover ≈ $3,556</text>
  <rect x="590" y="96" width="18" height="7" rx="2" fill="#136e79"/><text x="616" y="105" font-family="Arial,sans-serif" font-size="15" fill="#263b49">Rent: $1,100</text>
  <rect x="744" y="96" width="18" height="7" rx="2" fill="#de8138"/><text x="770" y="105" font-family="Arial,sans-serif" font-size="15" fill="#263b49">Commission</text>
  <text x="56" y="455" font-family="Arial,sans-serif" font-size="13" fill="#617783">Assumes 45% salon share and $500 monthly commission-chair costs. Not a market benchmark.</text>
</svg>
