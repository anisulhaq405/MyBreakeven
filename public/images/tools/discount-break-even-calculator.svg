<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef4ff"/><stop offset="1" stop-color="#e6f7f1"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="1130" cy="80" r="250" fill="#ddd8fc" opacity=".55"/><g font-family="Arial,sans-serif"><text x="64" y="74" fill="#16746f" font-size="23" font-weight="700">MYBREAKEVEN · FREE PRICING TOOLS</text><text x="64" y="142" fill="#183144" font-size="44" font-weight="700">Discount break-even</text><text x="64" y="185" fill="#526675" font-size="26">What must extra sales recover?</text><rect x="64" y="234" width="490" height="322" rx="24" fill="#fff"/><rect x="582" y="234" width="554" height="322" rx="24" fill="#153e48"/><text x="96" y="284" fill="#526675" font-size="22">CURRENT MONTH</text><text x="96" y="347" fill="#183144" font-size="48" font-weight="700">$100 × 100 sales</text><text x="96" y="395" fill="#526675" font-size="23">$60 cost per sale · 3% fee</text><line x1="96" y1="425" x2="522" y2="425" stroke="#d7e5e8"/><text x="96" y="472" fill="#16746f" font-size="35" font-weight="700">$3,700 contribution</text><text x="96" y="511" fill="#526675" font-size="20">Before overhead and owner pay</text><text x="616" y="284" fill="#d0e5e7" font-size="22">AFTER 10% OFF</text><text x="616" y="347" fill="#fff" font-size="48" font-weight="700">$90 per sale</text><text x="616" y="395" fill="#d0e5e7" font-size="23">$27.30 contribution per sale</text><line x1="616" y1="425" x2="1100" y2="425" stroke="#42616b"/><text x="616" y="472" fill="#fff" font-size="35" font-weight="700">136 sales needed</text><text x="616" y="511" fill="#bef0d9" font-size="24">+36 sales to preserve the baseline</text><text x="64" y="618" fill="#526675" font-size="21">Illustrative scenario · Same direct cost and fee rate · Whole completed sales</text></g></svg>