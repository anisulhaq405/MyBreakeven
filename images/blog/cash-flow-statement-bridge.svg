<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="title desc"><title id="title">Where did the closing cash come from?</title><desc id="desc">Opening + operating + investing + financing = closing cash</desc><rect width="1000" height="500" rx="20" fill="#f1f8f5"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="29" fill="#163c38" >Where did the closing cash come from?</text><text x="40" y="89" font-size="18" fill="#4d6661" >Opening + operating + investing + financing = closing cash</text><rect x="35" y="145" width="172" height="180" rx="13" fill="#ffffff" stroke="#b8d4ca"/><text x="50" y="180" font-size="18" fill="#163c38" >Opening cash</text><text x="50" y="235" font-size="29" fill="#163c38" >$10,000</text><text x="50" y="280" font-size="14" fill="#4d6661" >Start of March</text><rect x="225" y="145" width="172" height="180" rx="13" fill="#ffffff" stroke="#b8d4ca"/><text x="240" y="180" font-size="18" fill="#163c38" >Operating</text><text x="240" y="235" font-size="29" fill="#163c38" >+$2,000</text><text x="240" y="280" font-size="14" fill="#4d6661" >Ordinary activity</text><rect x="415" y="145" width="172" height="180" rx="13" fill="#ffffff" stroke="#b8d4ca"/><text x="430" y="180" font-size="18" fill="#163c38" >Investing</text><text x="430" y="235" font-size="29" fill="#163c38" >−$12,000</text><text x="430" y="280" font-size="14" fill="#4d6661" >Equipment paid</text><rect x="605" y="145" width="172" height="180" rx="13" fill="#ffffff" stroke="#b8d4ca"/><text x="620" y="180" font-size="18" fill="#163c38" >Financing</text><text x="620" y="235" font-size="29" fill="#163c38" >+$10,000</text><text x="620" y="280" font-size="14" fill="#4d6661" >Net capital flows</text><rect x="795" y="145" width="172" height="180" rx="13" fill="#d6efe3" stroke="#b8d4ca"/><text x="810" y="180" font-size="18" fill="#163c38" >Closing cash</text><text x="810" y="235" font-size="29" fill="#163c38" >$10,000</text><text x="810" y="280" font-size="14" fill="#4d6661" >End of March</text><text x="40" y="390" font-size="22" fill="#163c38" >Cash stayed flat while net financing covered the investment gap.</text><text x="40" y="470" font-size="16" fill="#4d6661" >MyBreakeven • Original fictional USD example • March 2026</text></g></svg>