<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Example landscaping winter cash reserve</title>
  <desc id="desc">Four slow months at five thousand dollars of fixed cash expense each require twenty thousand dollars in total if no winter cash is collected.</desc>
  <rect width="960" height="500" fill="#f6f9fb" rx="16"/>
  <text x="50" y="60" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173342">Cash needed through four slow months</text>
  <text x="50" y="92" font-family="Arial,sans-serif" font-size="18" fill="#486170">Assumes $5,000 of fixed cash outflow per month and $0 collected</text>
  <g font-family="Arial,sans-serif" font-size="18" fill="#19384b" text-anchor="middle"><text x="148" y="160">Month 1</text><text x="370" y="160">Month 2</text><text x="592" y="160">Month 3</text><text x="814" y="160">Month 4</text></g>
  <g fill="#dcebef"><rect x="48" y="182" width="200" height="120" rx="12"/><rect x="270" y="182" width="200" height="120" rx="12"/><rect x="492" y="182" width="200" height="120" rx="12"/><rect x="714" y="182" width="200" height="120" rx="12"/></g>
  <g font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0c6474" text-anchor="middle"><text x="148" y="250">$5,000</text><text x="370" y="250">$5,000</text><text x="592" y="250">$5,000</text><text x="814" y="250">$5,000</text></g>
  <path d="M48 350H914" stroke="#93abb5" stroke-width="2"/>
  <text x="50" y="404" font-family="Arial,sans-serif" font-size="21" fill="#19384b">Funding needed before the slow period</text>
  <text x="914" y="411" text-anchor="end" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#d5702e">$20,000</text>
  <text x="50" y="463" font-family="Arial,sans-serif" font-size="15" fill="#5b727c">A cash reserve pays already-budgeted costs; it is not another $20,000 expense.</text>
</svg>
