<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430"><title>One balance sheet, three working-capital definitions</title><rect width="1000" height="430" rx="18" fill="#eff7f4"/><g font-family="Arial,sans-serif" fill="#173d37"><text x="35" y="55" font-size="29">One balance sheet. Different account boundaries.</text><text x="35" y="91" font-size="19">Original fictional USD example; cash stays $8,000 in every comparison.</text><rect x="35" y="140" width="290" height="175" rx="12" fill="white" stroke="#bad8ca"/><text x="50" y="178" font-size="21">Net working capital</text><text x="50" y="237" font-size="35">$24,000</text><text x="50" y="280" font-size="16">All current assets less liabilities</text><rect x="355" y="140" width="290" height="175" rx="12" fill="white" stroke="#bad8ca"/><text x="370" y="178" font-size="21">Trade working capital</text><text x="370" y="237" font-size="35">$34,000</text><text x="370" y="280" font-size="16">Receivables + stock − payables</text><rect x="675" y="140" width="290" height="175" rx="12" fill="white" stroke="#bad8ca"/><text x="690" y="178" font-size="21">Selected operating WC</text><text x="690" y="237" font-size="35">$30,000</text><text x="690" y="280" font-size="14">Trade + prepaids − wage accruals</text><text x="35" y="365" font-size="20">The selected operating scope excludes cash, current debt and income tax payable.</text><text x="35" y="402" font-size="16">MyBreakeven • Definitions must match before comparing results.</text></g></svg>