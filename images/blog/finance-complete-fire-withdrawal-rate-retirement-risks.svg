<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f7fa"/><circle cx="1140" cy="60" r="225" fill="#815846" opacity=".06"/><text x="80" y="80" font-family="sans-serif" font-size="23" fill="#815846" font-weight="700">MYBREAKEVEN / EXPLAINED</text><text x="80" y="155" font-family="sans-serif" font-size="44" fill="#182b42" font-weight="700">The order of returns matters</text><text x="80" y="215" font-family="sans-serif" font-size="27" fill="#4a6075" >A smooth average hides the withdrawal path.</text><path d="M130 330 L520 510 L1000 395" fill="none" stroke="#815846" stroke-width="9"/><path d="M130 430 L520 295 L1000 365" fill="none" stroke="#386c80" stroke-width="9"/><path d="M130 550H1050" stroke="#bdcbd6" stroke-width="3"/><text x="260" y="610" font-family="sans-serif" font-size="18" fill="#815846" text-anchor="middle" font-weight="700">LOSS FIRST</text><text x="600" y="610" font-family="sans-serif" font-size="18" fill="#815846" text-anchor="middle" font-weight="700">WITHDRAWALS</text><text x="940" y="610" font-family="sans-serif" font-size="18" fill="#815846" text-anchor="middle" font-weight="700">GAIN FIRST</text></svg>