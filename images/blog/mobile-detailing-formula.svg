<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Mobile Detailing break-even formula</title><desc id="d">Formula from price and variable costs to contribution, required jobs and capacity.</desc><rect width="1200" height="630" rx="30" fill="#f6f8ff"/><g font-family="Arial,sans-serif"><text x="70" y="82" fill="#111934" font-size="38" font-weight="800">Mobile Detailing break-even formula</text><text x="70" y="122" fill="#66728b" font-size="20">Use current business inputs—not best-case assumptions.</text><rect x="70" y="182" width="286" height="126" rx="20" fill="white" stroke="#dce2f1" stroke-width="2"/><text x="96" y="224" fill="#66728b" font-size="18">AVERAGE PRICE</text><text x="96" y="270" fill="#111934" font-size="28" font-weight="700">per sale</text><text x="379" y="257" fill="#8994aa" font-size="38">−</text><rect x="424" y="182" width="286" height="126" rx="20" fill="white" stroke="#dce2f1" stroke-width="2"/><text x="450" y="224" fill="#66728b" font-size="18">VARIABLE COSTS</text><text x="450" y="270" fill="#111934" font-size="28" font-weight="700">per sale</text><text x="733" y="257" fill="#8994aa" font-size="38">=</text><rect x="778" y="182" width="352" height="126" rx="20" fill="#0891b2"/><text x="804" y="224" fill="white" opacity=".8" font-size="18">CONTRIBUTION</text><text x="804" y="270" fill="white" font-size="28" font-weight="700">per sale</text><path d="M600 337v52" stroke="#8994aa" stroke-width="4"/><rect x="70" y="412" width="1060" height="140" rx="22" fill="#111934"/><text x="104" y="459" fill="#aebbe0" font-size="18">MONTHLY NEED ÷ CONTRIBUTION</text><text x="104" y="511" fill="white" font-size="31" font-weight="800">Required Jobs → Revenue → Capacity check</text><circle cx="1052" cy="482" r="38" fill="#0891b2"/><path d="M1034 482l13 13 24-29" fill="none" stroke="white" stroke-width="8"/></g><text x="70" y="594" fill="#66728b" font-family="Arial,sans-serif" font-size="17">Exact fractional results stay separate from practical whole-jobs targets.</text></svg>