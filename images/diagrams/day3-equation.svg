<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"><title>Assets = liabilities + equity</title><desc>Closing balances; assets include cash, receivables and equipment.</desc><rect width="960" height="460" rx="20" fill="#f5f3ff"/><g font-family="Arial,sans-serif" fill="#18233b"><text x="40" y="46" font-size="27" font-weight="700">Assets = liabilities + equity</text><text x="40" y="76" font-size="18">Closing balances; assets include cash, receivables and equipment.</text><text x="40" y="135" font-size="20">Assets</text><rect x="265" y="110" width="510.0000" height="36" rx="5" fill="#5842b5"/><text x="790.0000" y="135" font-size="20" font-weight="700">$26,500</text><text x="40" y="193" font-size="20">Liabilities</text><rect x="265" y="168" width="125.0943" height="36" rx="5" fill="#0e7490"/><text x="405.0943" y="193" font-size="20" font-weight="700">$6,500</text><text x="40" y="251" font-size="20">Equity</text><rect x="265" y="226" width="384.9057" height="36" rx="5" fill="#8b5cf6"/><text x="664.9057" y="251" font-size="20" font-weight="700">$20,000</text><text x="40" y="309" font-size="20">Liabilities + equity</text><rect x="265" y="284" width="510.0000" height="36" rx="5" fill="#5842b5"/><text x="790.0000" y="309" font-size="20" font-weight="700">$26,500</text><text x="40" y="440" font-size="17">Original fictional USD case • MyBreakeven • November 6, 2026</text></g></svg>