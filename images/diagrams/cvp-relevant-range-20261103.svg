<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">CVP revenue and total cost at different sold volumes</title><desc id="d">Revenue at 120 dollars per unit crosses total costs of 9600 dollars plus 72 dollars per unit at 200 units and 24000 dollars. Capacity beyond 260 units requires a separate cost model.</desc><rect width="960" height="520" fill="#f4faf9"/><g font-family="Arial,sans-serif" fill="#163443"><text x="55" y="42" font-size="25" font-weight="bold">CVP: the original relevant-range model</text><text x="55" y="72" font-size="17">Fictional USD monthly example - before adding capacity costs</text><path d="M90 410.0H860" stroke="#ccdedd"/><text x="10" y="416.0" font-size="16">$0</text><path d="M90 330.0H860" stroke="#ccdedd"/><text x="10" y="336.0" font-size="16">$10,000</text><path d="M90 250.0H860" stroke="#ccdedd"/><text x="10" y="256.0" font-size="16">$20,000</text><path d="M90 170.0H860" stroke="#ccdedd"/><text x="10" y="176.0" font-size="16">$30,000</text><path d="M90 90.0H860" stroke="#ccdedd"/><text x="10" y="96.0" font-size="16">$40,000</text><text x="81.0" y="439" font-size="17">0</text><text x="331.0" y="439" font-size="17">100</text><text x="581.0" y="439" font-size="17">200</text><text x="831.0" y="439" font-size="17">300</text><polyline points="90.00,410.00 340.00,314.00 590.00,218.00 840.00,122.00" fill="none" stroke="#087e83" stroke-width="5"/><polyline points="90.00,333.20 340.00,275.60 590.00,218.00 840.00,160.40" fill="none" stroke="#c25438" stroke-width="5"/><circle cx="590" cy="218" r="7" fill="#163443"/><text x="390" y="193" font-size="20" font-weight="bold">Break-even: 200 units / $24,000</text><path d="M650 477H695" stroke="#087e83" stroke-width="5"/><text x="705" y="483" font-size="17">Revenue</text><path d="M90 477H135" stroke="#c25438" stroke-width="5"/><text x="145" y="483" font-size="17">Total cost</text><text x="410" y="469" font-size="17">Sold units</text></g></svg>