<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Growth result depends on the capacity cost</title><desc id="d">The baseline result is $4,000. Twenty percent more jobs yields $6,000 only under unchanged costs; adding $2,500 capacity cost reduces the result to $3,500.</desc><rect width="960" height="520" fill="#f2f8f6"/><g font-family="Arial,sans-serif" fill="#183443"><text x="40" y="42" font-size="25" font-weight="bold">Growth result depends on the capacity cost</text><text x="40" y="80" font-size="19">Independent monthly cases; fictional USD</text><text x="40" y="145" font-size="19">Baseline</text><rect x="40" y="160" width="440.0" height="38" rx="4" fill="#244d68"/><text x="495.0" y="187" font-size="23" font-weight="bold">$4,000</text><text x="40" y="250" font-size="19">20% more jobs within existing costs</text><rect x="40" y="265" width="660.0" height="38" rx="4" fill="#087e83"/><text x="715.0" y="292" font-size="23" font-weight="bold">$6,000</text><text x="40" y="355" font-size="19">20% more jobs plus capacity commitment</text><rect x="40" y="370" width="385.0" height="38" rx="4" fill="#bd4f35"/><text x="440.0" y="397" font-size="23" font-weight="bold">$3,500</text><text x="40" y="488" font-size="18">The simple 120-job case exceeds the stated 220-hour capacity.</text></g></svg>