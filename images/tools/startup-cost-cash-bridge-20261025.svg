<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Startup cash needed before available funds</title><desc id="desc">The fictional example adds 2,000 unpaid launch cash, 200 contingency, 2,600 trading deficit and a 1,000 floor. Required cash is 5,800. Available cash 3,000 leaves a 2,800 gap.</desc><rect width="1200" height="675" fill="#edf5f5"/><circle cx="1150" cy="35" r="190" fill="#ddebed"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="16" letter-spacing="2" font-weight="700" fill="#225c67">MYBREAKEVEN · STARTUP FUNDING</text><text x="64" y="130" font-size="42" font-weight="700" fill="#17314f">Know the cash needed before launch</text><text x="64" y="172" font-size="22" fill="#486579">Separate unpaid spending from the early trading shortfall.</text><g transform="translate(64,210)"><rect width="250" height="122" rx="14" fill="white" stroke="#d4e1e7"/><rect x="20" y="23" width="12" height="12" rx="3" fill="#285b72"/><text x="44" y="36" font-size="19" fill="#39546c">Unpaid launch</text><text x="20" y="88" font-size="36" font-weight="700" fill="#17314f">$2,000</text></g><g transform="translate(338,210)"><rect width="250" height="122" rx="14" fill="white" stroke="#d4e1e7"/><rect x="20" y="23" width="12" height="12" rx="3" fill="#8bc0c5"/><text x="44" y="36" font-size="19" fill="#39546c">Contingency</text><text x="20" y="88" font-size="36" font-weight="700" fill="#17314f">$200</text></g><g transform="translate(612,210)"><rect width="250" height="122" rx="14" fill="white" stroke="#d4e1e7"/><rect x="20" y="23" width="12" height="12" rx="3" fill="#527aaf"/><text x="44" y="36" font-size="19" fill="#39546c">Trading deficit</text><text x="20" y="88" font-size="36" font-weight="700" fill="#17314f">$2,600</text></g><g transform="translate(886,210)"><rect width="250" height="122" rx="14" fill="white" stroke="#d4e1e7"/><rect x="20" y="23" width="12" height="12" rx="3" fill="#91bda8"/><text x="44" y="36" font-size="19" fill="#39546c">Chosen cash floor</text><text x="20" y="88" font-size="36" font-weight="700" fill="#17314f">$1,000</text></g><rect x="64" y="366" width="369.6551724137931" height="55" fill="#285b72"/><rect x="433.6551724137931" y="366" width="36.96551724137931" height="55" fill="#8bc0c5"/><rect x="470.6206896551724" y="366" width="480.55172413793105" height="55" fill="#527aaf"/><rect x="951.1724137931035" y="366" width="184.82758620689654" height="55" fill="#91bda8"/><rect x="64" y="458" width="1072" height="142" rx="16" fill="#17314f"/><text x="92" y="500" font-size="20" fill="#d6e9ed">Required cash</text><text x="92" y="554" font-size="39" fill="white" font-weight="700">$5,800</text><text x="410" y="500" font-size="20" fill="#d6e9ed">Available now</text><text x="410" y="554" font-size="39" fill="white" font-weight="700">− $3,000</text><text x="770" y="500" font-size="20" fill="#d6e9ed">Additional funding gap</text><text x="770" y="554" font-size="39" fill="white" font-weight="700">= $2,800</text><text x="64" y="640" font-size="17" fill="#486579">Fictional USD example · $500 already paid is not charged again · Monthly cash timing</text></g></svg>