<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#eff4fa"/><text x="70" y="85" font-family="Arial" font-size="22" fill="#46627f">MYBREAKEVEN · FICTIONAL USD EXAMPLE</text><text x="70" y="155" font-family="Arial" font-size="46" font-weight="700" fill="#173451">From revenue to operating income</text><rect x="70" y="240" width="250" height="180" rx="18" fill="#234c7e"/><text x="90" y="292" font-family="Arial" font-size="22" fill="white">Net revenue</text><text x="90" y="365" font-family="Arial" font-size="44" fill="white">50,000</text><rect x="350" y="240" width="250" height="180" rx="18" fill="#597695"/><text x="370" y="292" font-family="Arial" font-size="22" fill="white">Less COGS</text><text x="370" y="365" font-family="Arial" font-size="44" fill="white">20,000</text><rect x="630" y="240" width="250" height="180" rx="18" fill="#9a642d"/><text x="650" y="292" font-family="Arial" font-size="22" fill="white">Less OPEX</text><text x="650" y="365" font-family="Arial" font-size="44" fill="white">18,000</text><rect x="910" y="240" width="250" height="180" rx="18" fill="#23684d"/><text x="930" y="292" font-family="Arial" font-size="22" fill="white">Operating income</text><text x="930" y="365" font-family="Arial" font-size="44" fill="white">12,000</text><text x="70" y="515" font-family="Arial" font-size="36" font-weight="700" fill="#173451">Operating margin = 12,000 ÷ 50,000 = 24%</text><text x="70" y="575" font-family="Arial" font-size="24" fill="#46627f">OPEX excludes COGS. Count each operating cost once.</text></svg>