<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Break-even does not establish capacity feasibility</title><desc id="d">Operating break-even requires 30 jobs. Practical capacity permits 40. The combined overhead and chosen owner-income requirement needs 50 jobs.</desc><rect width="960" height="520" fill="#f2f8f6"/><g font-family="Arial,sans-serif" fill="#183443"><text x="40" y="42" font-size="25" font-weight="bold">Break-even does not establish capacity feasibility</text><text x="40" y="80" font-size="19">Original three-hour service; 120 practical delivery hours</text><text x="40" y="145" font-size="19">Operating break-even</text><rect x="40" y="160" width="420" height="38" rx="4" fill="#087e83"/><text x="475" y="187" font-size="23" font-weight="bold">30 jobs</text><text x="40" y="250" font-size="19">Practical capacity</text><rect x="40" y="265" width="560" height="38" rx="4" fill="#244d68"/><text x="615" y="292" font-size="23" font-weight="bold">40 jobs</text><text x="40" y="355" font-size="19">Including owner-income requirement</text><rect x="40" y="370" width="700" height="38" rx="4" fill="#bd4f35"/><text x="755" y="397" font-size="23" font-weight="bold">50 jobs</text><text x="40" y="488" font-size="18">The 50-job combined target exceeds original capacity by 10 jobs.</text></g></svg>