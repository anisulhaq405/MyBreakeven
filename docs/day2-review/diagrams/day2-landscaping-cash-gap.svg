<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Same final cash, different seasonal low point</title><desc id="d">Base and delayed-receipt cases both end at $4,000. The lowest weekly closing cash is minus $3,000 in the base case and minus $5,000 after delay.</desc><rect width="960" height="520" fill="#f2f8f6"/><g font-family="Arial,sans-serif" fill="#183443"><text x="40" y="42" font-size="25" font-weight="bold">Same final cash, different seasonal low point</text><path d="M110 375.0H865" stroke="#c4d7d7"/><text x="20" y="381.0" font-size="17">$-5,000</text><path d="M110 290.0H865" stroke="#c4d7d7"/><text x="20" y="296.0" font-size="17">$0</text><path d="M110 205.0H865" stroke="#c4d7d7"/><text x="20" y="211.0" font-size="17">$5,000</text><path d="M110 120.0H865" stroke="#c4d7d7"/><text x="20" y="126.0" font-size="17">$10,000</text><text x="88" y="412" font-size="18">Apr 2</text><text x="328" y="412" font-size="18">Apr 9</text><text x="568" y="412" font-size="18">Apr 16</text><text x="808" y="412" font-size="18">Apr 23</text><path d="M110 205H865" stroke="#89712b" stroke-width="2" stroke-dasharray="8 6"/><text x="560" y="194" font-size="18">Chosen floor: $5,000</text><polyline points="110,222.0 350,341.0 590,273.0 830,222.0" fill="none" stroke="#087e83" stroke-width="5"/><circle cx="110" cy="222.0" r="6" fill="#087e83"/><circle cx="350" cy="341.0" r="6" fill="#087e83"/><circle cx="590" cy="273.0" r="6" fill="#087e83"/><circle cx="830" cy="222.0" r="6" fill="#087e83"/><path d="M110 450H160" stroke="#087e83" stroke-width="5"/><text x="175" y="455" font-size="19">Base receipts</text><polyline points="110,222.0 350,341.0 590,375.0 830,222.0" fill="none" stroke="#bd4f35" stroke-width="5"/><circle cx="110" cy="222.0" r="6" fill="#bd4f35"/><circle cx="350" cy="341.0" r="6" fill="#bd4f35"/><circle cx="590" cy="375.0" r="6" fill="#bd4f35"/><circle cx="830" cy="222.0" r="6" fill="#bd4f35"/><pat