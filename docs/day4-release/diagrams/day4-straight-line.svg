<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Straight-line carrying amount schedule</title><desc id="desc">Cost 14,000 dollars less 12,000 dollars total depreciation over sixty months leaves residual value 2,000 dollars. First and last years are partial.</desc><rect width="960" height="460" rx="16" fill="#f5f2ff"/><g font-family="system-ui,sans-serif" fill="#202343"><text x="36" y="42" font-size="26" font-weight="700">Carrying amount at each calendar year-end</text><text x="36" y="70" font-size="17">USD · $14,000 cost · $2,000 residual · $200 per month</text><text x="36" y="124" font-size="17">2027 · 9 months</text><rect x="240" y="100" width="488.00" height="32" rx="4" fill="#6550be"/><text x="738.00" y="123" font-size="18">$12,200</text><text x="36" y="173" font-size="17">2028 · 12 months</text><rect x="240" y="149" width="392.00" height="32" rx="4" fill="#6550be"/><text x="642.00" y="172" font-size="18">$9,800</text><text x="36" y="222" font-size="17">2029 · 12 months</text><rect x="240" y="198" width="296.00" height="32" rx="4" fill="#6550be"/><text x="546.00" y="221" font-size="18">$7,400</text><text x="36" y="271" font-size="17">2030 · 12 months</text><rect x="240" y="247" width="200.00" height="32" rx="4" fill="#6550be"/><text x="450.00" y="270" font-size="18">$5,000</text><text x="36" y="320" font-size="17">2031 · 12 months</text><rect x="240" y="296" width="104.00" height="32" rx="4" fill="#6550be"/><text x="354.00" y="319" font-size="18">$2,600</text><text x="36" y="369" font-size="17">2032 · 3 months</text><rect x="240" y="345" width="80.00" height="32" rx="4" fill="#6550be"/><text x="330.00" y="368" font-size="18">$2,000</text><text x="36" y="425" font-size="17">Available April 1, 2027 · Whole-month policy · 60 months total</text></g></svg>