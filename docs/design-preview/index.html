<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyBreakeven — Cluster Design Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#f0edf6;font-family:system-ui,sans-serif;color:#3e3354}.review-toolbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:white;border-bottom:1px solid #e3dcec;position:sticky;top:0;z-index:2;gap:16px}.review-label{font-size:13px;font-weight:700}.review-label small{display:block;color:#9a89ad;font-size:10px;font-weight:500;margin-top:3px;letter-spacing:.4px}.review-buttons{display:flex;gap:5px;background:#f0ecf7;padding:4px;border-radius:9px}.review-buttons button{border:0;background:transparent;color:#8a799c;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}.review-buttons button[aria-pressed=true]{background:white;color:#70539b;box-shadow:0 1px 4px #3f245418}.review-shell{margin:22px auto;background:white;max-width:calc(100% - 32px);width:1240px;border:1px solid #ddd4e9;box-shadow:0 15px 50px #42305914;border-radius:16px;overflow:hidden;transition:width .2s}.review-shell.mobile{width:390px;border-radius:24px;border:6px solid #292334;box-shadow:0 15px 50px #42305925}iframe{width:100%;height:1080px;display:block;border:0}.mobile iframe{height:810px}.review-note{text-align:center;color:#9683a5;font-size:11px;margin:15px 0 25px}a{color:#70539b}@media(max-width:600px){.review-label{font-size:11px}.review-toolbar{padding:0 12px}.review-buttons button{padding:8px}.review-shell{margin:15px auto}}</style></head><body><header class="review-toolbar"><div class="review-label">MyBreakeven · Library redesign<small>WORKING PREVIEW · NOT PUBLISHED</small></div><div class="review-buttons" aria-label="Preview size"><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Mobile</button></div><a href="/blogs/#guide-topics-title" target="_blank" rel="noopener">Open full page ↗</a></header><main class="review-shell" id="shell"><iframe id="preview" title="MyBreakeven blog design preview" src="/blogs/#guide-topics-title"></iframe></main><p class="review-note">This is the actual working page. Try the topic menu and “By business” view.</p><script>const shell=document.getElementById('shell'),frame=document.getElementById('preview');function scrollToLibrary(){const doc=frame.contentDocument;const heading=doc?.getElementById('guide-topics-title');if(heading){heading.scrollIntoView({block:'start'});return true;}return false;}frame.addEventListener('load',()=>{if(scrollToLibrary())return;const observer=new MutationObserver(()=>{if(scrollToLibrary())observer.disconnect();});observer.observe(frame.contentDocument,{subtree:true,childList:true});});for(const size of ['desktop','mobile'])document.getElementById(size).onclick=()=>{shell.classList.toggle('mobile',size==='mobile');for(const other of ['desktop','mobile'])document.getElementById(other).setAttribute('aria-pressed',other===size);requestAnimationFrame(()=>{scrollToLibrary();window.scrollTo({top:0});});};</script></body></html>
